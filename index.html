<!DOCTYPE html>
<html>
<head>
  <title>Founder BI Agent</title>
</head>
<body>
  <h1>Founder BI Agent</h1>
  <input id="prompt" type="text" placeholder="Ask a question..." />
  <button onclick="sendPrompt()">Ask</button>

  <h2>Quick Dashboards</h2>
  <button onclick="sendPrompt('Deals this quarter')">Deals This Quarter</button>
  <button onclick="sendPrompt('Mining pipeline this quarter')">Mining Pipeline</button>
  <button onclick="sendPrompt('Sector value this quarter')">Sector Value</button>
  <button onclick="sendPrompt('Execution summary')">Execution Summary</button>

  <h2>Answer</h2>
  <pre id="answer"></pre>

  <script src="/app.js"></script>
</body>
</html>
